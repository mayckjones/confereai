<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConfereAI — Ferramentas para seu negócio</title>
<meta name="description" content="Plataforma de ferramentas financeiras e operacionais para seu negócio. Conciliação Bancária, análise de dados e muito mais.">
<meta name="theme-color" content="#0056FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ConfereAI">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Libs globais -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Design System -->
<link rel="stylesheet" href="css/global.css">

</head>
<body>

<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║  SHELL DA APLICAÇÃO — Topbar + Container + Overlays               ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->

<div class="app">

  <!-- HEADER -->
  <header class="app-header">
    <!-- LOGO CARD -->
    <div class="topbar">
      <a class="brand" href="#/home" title="Voltar ao início">
        <img class="brand-logo" src="logo.svg" alt="ConfereAI">
      </a>
    </div>

    <!-- SUB-NAV (Menu & Theme) -->
    <div class="sub-nav">
      <nav class="topbar-nav">
        <a class="topbar-nav-btn" href="#/home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Início
        </a>
        <a class="topbar-nav-btn" href="#/conciliacao">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="M9 14l2 2 4-4"/></svg>
          Conciliação Bancária
        </a>
      </nav>
      <div class="topbar-right">
        <button class="theme-switch" id="themeToggle" title="Alternar modo claro/escuro" aria-label="Alternar tema">
          <span class="switch-icon switch-icon-sun">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
          </span>
          <span class="switch-icon switch-icon-moon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="switch-knob"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO DINÂMICO (Ferramentas carregadas via JS Fetch) -->
  <main id="app-content"></main>

  <div class="signature">feito por <span>Mayck Jones</span></div>
</div>

<!-- Loading overlay (global) -->
<div class="overlay" id="overlay">
  <div class="loader-card">
    <div class="spinner"></div>
    <p id="overlayMsg">Processando…</p>
  </div>
</div>

<!-- Toast (global) -->
<div class="toast" id="toast"></div>


<!-- ╔══════════════════════════════════════════════════════════════════════╗
     ║  SCRIPTS — Utilitários + Registry + Router                        ║
     ╚══════════════════════════════════════════════════════════════════════╝ -->

<!-- Utilitários compartilhados (dark mode, toast, overlay, formatação) -->
<script src="js/shared.js"></script>

<!-- Registro de ferramentas (TOOLS_REGISTRY array) -->
<script src="ferramentas/registry.js"></script>

<!-- Router SPA (carrega HTML, CSS e JS dinamicamente da pasta tools/) -->
<script src="js/router.js"></script>

<!-- Theme toggle binding -->
<script>
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
</script>

</body>
</html>
