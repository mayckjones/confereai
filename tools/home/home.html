<!-- ConfereAI — Página Inicial (Hub de Ferramentas) -->

<div class="home-hero">
  <div class="hero-content">
    <h1 class="hero-title">Suas ferramentas</h1>
    <p class="hero-subtitle">Selecione uma ferramenta para começar. Todas rodam no seu navegador — nenhum dado é enviado para servidores externos.</p>
  </div>
  <div class="hero-search-wrap">
    <svg class="hero-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="toolSearch" class="hero-search" placeholder="Buscar ferramenta…" autocomplete="off">
  </div>
</div>

<div class="tools-grid" id="toolsGrid">
  <!-- Cards gerados dinamicamente por home.js -->
</div>

<div class="tools-empty" id="toolsEmpty" style="display:none;">
  <div class="empty-state">
    <div class="es-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <h4>Nenhuma ferramenta encontrada</h4>
    <p>Tente outro termo de busca.</p>
  </div>
</div>
